<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRIPRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TRIPRO · projetos da Trium: hoje, quadro, agenda, sprints, Curva S e assistente de IA">
<meta name="theme-color" content="#142C65">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRIPRO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem('tripro-tema');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --navy:#142C65;--navy2:#0F2353;--blue:#2453AB;--blue-h:#1E4796;--light:#8BC4FF;--cyan:#25C4EE;
  --bg:#F5F7FB;--surface:#fff;--surface2:#FAFBFD;--hover:#F4F7FC;--sky:#EEF4FF;--col:#EDF1F8;
  --ink:#142C65;--text:#24304D;--muted:#6B7A99;--faint:#9AA6BF;--line:#E7ECF4;--line2:#D6E0F0;
  --ok:#17845A;--ok-bg:#E7F6EF;--crit:#C83B3B;--crit-bg:#FCECEC;--warn:#B7700F;--warn-bg:#FFF4E2;--neu-bg:#EEF2F8;--pur:#6B4FD8;--pur-bg:#F0EDFD;
  --plan:#A9B5CC;--real:#2453AB;--proj:#25C4EE;--shadow:0 18px 50px rgba(10,20,50,.16);
  --sbw:248px;--sbm:72px;--gap:clamp(14px,1.6vw,22px);--pad:clamp(16px,2.4vw,32px);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --navy:#0B1838;--navy2:#08122B;--blue:#4A7FE0;--blue-h:#5C8DEA;--light:#8BC4FF;
  --bg:#0D1424;--surface:#141D31;--surface2:#18223A;--hover:#1B2742;--sky:#1A2B50;--col:#111A2D;
  --ink:#E8EEFA;--text:#C9D3E6;--muted:#8D9AB8;--faint:#66738F;--line:#24304B;--line2:#33415F;
  --ok:#3FC28A;--ok-bg:#12352A;--crit:#F07171;--crit-bg:#3A1A1F;--warn:#F0B04A;--warn-bg:#3A2A12;--neu-bg:#1F2A44;--pur:#A08CF5;--pur-bg:#2A2450;
  --plan:#5D6B88;--real:#6FA0FF;--shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0B1838;--navy2:#08122B;--blue:#4A7FE0;--blue-h:#5C8DEA;--light:#8BC4FF;
  --bg:#0D1424;--surface:#141D31;--surface2:#18223A;--hover:#1B2742;--sky:#1A2B50;--col:#111A2D;
  --ink:#E8EEFA;--text:#C9D3E6;--muted:#8D9AB8;--faint:#66738F;--line:#24304B;--line2:#33415F;
  --ok:#3FC28A;--ok-bg:#12352A;--crit:#F07171;--crit-bg:#3A1A1F;--warn:#F0B04A;--warn-bg:#3A2A12;--neu-bg:#1F2A44;--pur:#A08CF5;--pur-bg:#2A2450;
  --plan:#5D6B88;--real:#6FA0FF;--shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
h1,h2,h3,h4{color:var(--ink);letter-spacing:-.01em}
.tn{font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:22px 8px;text-align:center}
:focus-visible{outline:2px solid var(--light);outline-offset:2px}
svg{flex:none}
.ic16 svg,svg.i16{width:16px;height:16px}

/* marca */
.lockup{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.lockup .lg{flex:none;display:grid;place-items:center;background:#fff;border-radius:28%;box-shadow:0 6px 18px rgba(5,14,40,.28),0 0 0 1px rgba(139,196,255,.25)}

/* login: sempre claro, como na identidade */
.auth{--surface:#fff;--bg:#fff;--ink:#142C65;--text:#24304D;--muted:#6B7A99;--faint:#9AA6BF;--line:#E7ECF4;--line2:#D6E0F0;--sky:#F1F6FF;--blue:#2453AB;--blue-h:#1E4796;color-scheme:light;display:grid;grid-template-columns:minmax(0,54fr) minmax(0,46fr);min-height:100vh;min-height:100dvh;background:#fff;color:var(--text)}
.a-l{background:radial-gradient(900px 600px at 0% 0%,rgba(139,196,255,.10),transparent 60%),#142C65;color:#fff;padding:clamp(32px,5vw,76px) clamp(28px,5vw,96px) clamp(28px,4vw,56px);display:flex;flex-direction:column}
.a-l .lockup{font-size:clamp(22px,1.7vw,30px)}
.a-copy{margin:auto 0;padding:48px 0 40px}
.a-copy h1{color:#fff;font-size:clamp(34px,3.3vw,61px);line-height:1.15;letter-spacing:-.025em;font-weight:700}
.a-copy p{font-size:clamp(16px,1.2vw,22px);line-height:1.6;color:#C2D3F2;margin-top:22px;max-width:34ch}
.path{margin-top:clamp(28px,3.5vw,56px);border-radius:22px;background:rgba(255,255,255,.055);border:1px solid rgba(139,196,255,.2);padding:clamp(22px,2vw,40px) clamp(18px,2.3vw,44px);max-width:840px}
.path .eb{font-size:12.5px;font-weight:600;letter-spacing:.16em;color:#9FB8E6;text-transform:uppercase}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(20px,2vw,36px);position:relative}
.steps3::before{content:"";position:absolute;left:16.7%;right:16.7%;top:clamp(21px,1.8vw,34px);border-top:2px dashed rgba(139,196,255,.35)}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.st .c{width:clamp(42px,3.6vw,68px);height:clamp(42px,3.6vw,68px);border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,1.1vw,21px);font-weight:600;background:#1D3B7E;color:#C2D3F2;box-shadow:0 0 0 7px #18336F}
.st.on .c{background:#2453AB;color:#fff;box-shadow:0 0 0 7px #18336F,0 0 0 9px #8BC4FF}
.st b{font-size:clamp(14px,1.15vw,22px);font-weight:600;margin-top:clamp(12px,1.2vw,22px)}
.st span{font-size:clamp(12px,.85vw,16px);color:#AFC2E8;margin-top:4px}
.a-foot{font-size:13.5px;color:#8FA6D6;letter-spacing:.04em}
.a-r{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 28px}
.a-box{width:100%;max-width:500px}
.a-box h2{font-size:clamp(28px,2.3vw,44px);font-weight:700;letter-spacing:-.02em}
.a-box .s{font-size:clamp(15px,1.05vw,20px);color:var(--muted);margin-top:8px}
.gbtn{margin-top:14px;width:100%;height:clamp(52px,3.2vw,60px);border-radius:12px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(15.5px,1vw,18px);font-weight:600;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.gbtn:hover{border-color:#8BC4FF;box-shadow:0 4px 14px rgba(36,83,171,.12)}
.gbtn:disabled{cursor:progress;color:var(--muted)}
.gbtn img{width:22px;height:22px}
.note{margin-top:16px;border-radius:12px;background:var(--sky);padding:13px 16px;display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.5;color:#5B6B8C}
.note svg{color:var(--blue)}
.a-sep{border:0;border-top:1px solid var(--line);margin:clamp(22px,2.2vw,40px) 0 clamp(14px,1.5vw,26px)}
.demo{text-align:center}.demo b{display:block;font-size:12px;letter-spacing:.16em;color:#8A97B2;font-weight:600}.demo span{display:block;font-size:14px;color:#7A88A6;margin-top:6px}
.a-rf{margin-top:clamp(24px,3vw,40px);font-size:13px;color:var(--faint)}
.a-who{display:flex;align-items:center;gap:14px;margin-bottom:26px;padding:14px;border:1px solid var(--line);border-radius:14px}
.a-who b{display:block;color:var(--ink)}
.a-btns{display:flex;gap:10px;margin-top:26px}.a-btns .btn{flex:1;height:48px}
.lgf{display:flex;flex-direction:column;gap:14px;margin-top:clamp(20px,2.2vw,32px)}
.lgi{height:50px;font-size:15.5px;border-radius:12px}
.lgb{height:clamp(50px,3.1vw,56px);border-radius:12px;font-size:16px}
.lnk{color:var(--blue);font-weight:600;font-size:14px;padding:0}.lnk:hover{text-decoration:underline}
.lgalt{margin-top:18px;text-align:center;font-size:14.5px;color:var(--muted)}
.ou{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:13px;margin:20px 0 0}.ou::before,.ou::after{content:"";flex:1;border-top:1px solid var(--line)}
@media (max-width:900px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .a-l{padding:32px 26px 28px}.a-copy{margin:0;padding:30px 0 0}.a-copy p{margin-top:10px}
  .a-copy .long{display:none}.st span,.a-foot{display:none}
  .path{margin-top:22px;padding:18px 14px 16px;border-radius:18px}.path .eb{font-size:11px;padding-left:6px}
  .st .c{box-shadow:0 0 0 5px #18336F}.st.on .c{box-shadow:0 0 0 5px #18336F,0 0 0 7px #8BC4FF}
  .a-r{justify-content:flex-start;padding:28px 26px calc(20px + env(safe-area-inset-bottom))}
}
@media (min-width:901px){.a-copy .short{display:none}}

/* casca */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;min-height:100dvh;transition:grid-template-columns .2s ease}
body.sb-mini .app{grid-template-columns:var(--sbm) minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;height:100dvh;background:var(--navy);color:#C9D7F2;display:flex;flex-direction:column;padding:18px 12px calc(12px + env(safe-area-inset-bottom));overflow:hidden;z-index:40}
.sb-h{display:flex;align-items:center;height:44px;padding:0 6px;margin-bottom:14px}
.sb-h .lockup{color:#fff;font-size:18px}
.sb nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.sb .grp{font-size:10.5px;font-weight:600;letter-spacing:.14em;color:#7F97C9;text-transform:uppercase;padding:14px 12px 6px;white-space:nowrap}
.nl{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#C9D7F2;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;position:relative;transition:background .12s,color .12s;width:100%;text-align:left}
.nl svg{width:19px;height:19px}
.nl:hover{background:rgba(255,255,255,.06);color:#fff}
.nl.on{background:rgba(139,196,255,.14);color:#fff}
.nl.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan)}
.nl .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--cyan);color:#0B1838;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.sb-f{border-top:1px solid rgba(139,196,255,.14);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.me>a{display:flex;align-items:center;gap:10px;min-width:0;flex:1;color:inherit;text-decoration:none}
.me div{min-width:0}.me b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}.me div span{display:block;font-size:12px;color:#9FB8E6}
.me .out{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#AFC2E8;flex:none}.me .out:hover{background:rgba(255,255,255,.08);color:#fff}
body.sb-mini .sb .lbl,body.sb-mini .sb .grp,body.sb-mini .me div,body.sb-mini .me .out,body.sb-mini .sb-h .lockup>span:last-child{display:none}
body.sb-mini .nl{justify-content:center;padding:0}
body.sb-mini .nl .bd{position:absolute;top:2px;right:5px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
body.sb-mini .sb .grp{display:block;height:10px;padding:0;font-size:0}
body.sb-mini .me,body.sb-mini .sb-h{justify-content:center;padding-left:0;padding-right:0}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:60px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 var(--pad);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.tg{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:var(--surface);flex:none;position:relative}
.tg:hover{border-color:var(--line2)}
.tg .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.cmd-b{flex:1;max-width:520px;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--faint);font-size:14px;min-width:0}
.cmd-b:hover{border-color:var(--line2)}
.cmd-b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
.cmd-b kbd{font:600 11px Inter,sans-serif;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.content{padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap);width:100%}
.scrim{display:none}
@media (max-width:959px){
  .app,body.sb-mini .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:min(84vw,286px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(10,20,50,.3);padding-top:calc(18px + env(safe-area-inset-top))}
  body.sb-open .sb{transform:none}
  body.sb-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:35}
  body.sb-mini .sb .lbl,body.sb-mini .sb .grp,body.sb-mini .me div,body.sb-mini .me .out,body.sb-mini .sb-h .lockup>span:last-child{display:revert}
  body.sb-mini .nl{justify-content:flex-start;padding:0 12px}
  body.sb-mini .nl .bd{position:static;min-width:20px;height:20px;font-size:11.5px}
  body.sb-mini .sb .grp{height:auto;padding:14px 12px 6px;font-size:10.5px}
  body.sb-mini .me,body.sb-mini .sb-h{justify-content:flex-start;padding-left:6px}
  .hide-m{display:none!important}
  .cmd-b{flex:0 0 38px;width:38px;padding:0;justify-content:center;color:var(--blue)}.cmd-b span,.cmd-b kbd{display:none}
  .psw-b{max-width:38vw}.top{gap:6px}
}
@media (min-width:960px){.only-m{display:none!important}}

/* seletor de projeto */
.psw{position:relative;min-width:0;flex:0 1 auto}
.psw-b{height:38px;display:flex;align-items:center;gap:9px;padding:0 10px 0 7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;max-width:min(300px,46vw);font-weight:600;color:var(--ink);font-size:14px}
.psw-b:hover{border-color:var(--line2)}
.psw-b span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.psw-b>svg{color:var(--faint);width:16px;height:16px}
.dotp{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex:none;background:var(--navy)}
.dotp.lg{width:30px;height:30px;border-radius:8px;font-size:11.5px}
.pop{position:absolute;top:calc(100% + 8px);left:0;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:50;overflow:hidden}
.pop.r{left:auto;right:0}
.pop .srch{padding:10px;border-bottom:1px solid var(--line)}
.pop .srch input{width:100%;height:38px;border:1px solid var(--line2);border-radius:9px;padding:0 12px;background:var(--surface)}
.pop .srch input:focus{outline:none;border-color:var(--blue)}
.pop .lst{max-height:min(400px,60vh);overflow-y:auto;padding:6px}
.pi{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:9px;text-align:left}
.pi:hover,.pi.on{background:var(--hover)}
.pi div{min-width:0;flex:1}.pi b{display:block;font-size:14px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .mb2{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.pi .mb2 .bar{flex:1;height:4px}
.pop .ft{border-top:1px solid var(--line);padding:6px;display:flex;gap:4px}
.pop .ft a,.pop .ft button{flex:1;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue);text-decoration:none}
.pop .ft a:hover,.pop .ft button:hover{background:var(--hover)}
.pop .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.pop .hd b{color:var(--ink);font-size:14.5px}
.nt{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.nt:hover{background:var(--hover)}.nt:last-child{border-bottom:0}
.nt .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--sky);color:var(--blue)}
.nt .ico svg{width:16px;height:16px}
.nt b{display:block;font-size:13.5px;color:var(--ink);font-weight:600}.nt p{font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nt.novo b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--crit);margin-left:7px;vertical-align:2px}
.nt span.sub{font-size:11.5px}

/* componentes */
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:clamp(21px,1.8vw,26px);font-weight:700}
.ph p{color:var(--muted);font-size:14px;margin-top:2px}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s;text-decoration:none}
.btn:hover{border-color:var(--light);background:var(--hover)}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-h);border-color:var(--blue-h)}
.btn-d{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}.btn-d:hover{background:var(--crit-bg);border-color:var(--crit)}
.btn-ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.btn-ok:hover{background:var(--ok-bg);border-color:var(--ok)}
.btn-g{border-color:transparent;background:transparent;color:var(--muted)}.btn-g:hover{background:var(--hover);border-color:transparent;color:var(--ink)}
.btn-sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn-i{width:32px;padding:0}
.btn svg{width:16px;height:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line);min-height:52px}
.card-h h2{font-size:15px;font-weight:600}
.card-h .hic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--sky);color:var(--blue)}.card-h .hic svg{width:16px;height:16px}
.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:var(--gap)}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-crit{background:var(--crit-bg);color:var(--crit)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-brand{background:var(--sky);color:var(--blue)}.p-neu{background:var(--neu-bg);color:var(--muted)}.p-pur{background:var(--pur-bg);color:var(--pur)}
.bar{height:6px;border-radius:4px;background:var(--neu-bg);overflow:hidden;min-width:30px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}.bar i.ok{background:var(--ok)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:var(--gap);align-items:start}
.g-main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (max-width:1180px){.g-main{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:var(--gap)}
.pc{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}

.pc .m span{display:block;font-size:11.5px;color:var(--muted)}.pc .m b{font-size:15px;color:var(--ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li>.bx{min-width:0;flex:1;cursor:pointer}

.li span.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--blue);background:var(--sky);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:1px;white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sel,.inp{height:38px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:0 12px;font-size:14px;min-width:0;color:var(--text)}
.sel:focus,.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--light) 35%,transparent)}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical;line-height:1.5}
.search{position:relative;display:inline-flex}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}.search .sel{padding-left:34px;width:min(240px,100%)}
.tbl-w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.legend i.ln{width:14px;height:3px;border-radius:2px;vertical-align:3px}
.chart{position:relative}.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}.chart .ax{fill:var(--faint);font-size:11px}
.tip{position:absolute;transform:translateX(-50%);background:#0B1838;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;line-height:1.45}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 24px}
.mod b{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:7px}.mod b span{color:var(--muted);font-weight:500}
.av{width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.lg{width:48px;height:48px;font-size:16px}.av.xs{width:24px;height:24px;font-size:10px}.av.sm{width:28px;height:28px;font-size:11px}
.sb .av{background:rgba(139,196,255,.18);color:#fff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;scrollbar-width:none;align-items:center}
.tab{height:44px;padding:0 11px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .ct{min-width:20px;height:19px;padding:0 6px;border-radius:10px;background:var(--neu-bg);font-size:11.5px;display:grid;place-items:center}
.tab.on .ct{background:var(--sky);color:var(--blue)}
.seg{display:inline-flex;background:var(--neu-bg);border-radius:10px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,20,50,.12)}
.urow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow .who{flex:1;min-width:190px}.urow .who b{display:block;color:var(--ink);font-weight:600}.urow .who span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.urow .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.how i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--blue);font-style:normal;font-weight:700;font-size:12.5px;display:grid;place-items:center}
.how b{color:var(--ink);display:block;font-size:14px}
.fi{display:flex;gap:13px;padding:14px 18px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi .bx{min-width:0;flex:1}.fi .meta{font-size:12.5px;color:var(--muted)}
.fi p{margin-top:3px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.fi .ref{margin-top:6px;font-size:12.5px;color:var(--blue);font-weight:500;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.fi .ref svg{width:14px;height:14px}
.men{color:var(--blue);font-weight:600;background:var(--sky);border-radius:5px;padding:0 4px}
.set{display:flex;gap:16px;align-items:flex-start;padding:15px 18px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}.set>div{flex:1;min-width:0}.set b{display:block;color:var(--ink);font-weight:600;font-size:14.5px}.set span{font-size:13.5px;color:var(--muted)}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line2);position:relative;flex:none;transition:background .15s;margin-top:2px}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--blue)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.banner{background:var(--sky);border:1px solid var(--line2);color:var(--muted);border-radius:12px;padding:9px 14px;font-size:13px}

/* inteligência */
.ai{position:relative;overflow:hidden;background:linear-gradient(135deg,#142C65 0%,#1E3F8F 100%);border:0;color:#E4ECFB}
.ai::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(37,196,238,.25),transparent 70%);pointer-events:none}

.pts{display:flex;flex-direction:column;gap:8px}
.pts div{display:flex;gap:10px;align-items:flex-start}

.ins{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}

.ins>div{flex:1;min-width:0}.ins b{display:block;color:var(--ink);font-size:14px;font-weight:600}.ins p{font-size:13px;color:var(--muted)}
.ins .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.spr{display:flex;flex-direction:column;gap:14px}
.spr-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--blue) calc(var(--p)*1%),var(--neu-bg) 0);display:grid;place-items:center;flex:none}
.ring::before{content:attr(data-v);width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:15px}

@media (max-width:520px){.est{grid-template-columns:repeat(2,1fr)}}

/* quadro */
.kboard{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:var(--gap);overflow-x:auto;padding-bottom:6px;align-items:start}
.kcol{background:var(--col);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;transition:background .12s,box-shadow .12s}

.kcol header{display:flex;align-items:center;gap:8px;padding:4px 6px 6px}
.kcol header b{font-size:13.5px;color:var(--ink)}
.kcol header i{width:8px;height:8px;border-radius:50%}
.kcol header .ct{font-size:12px;color:var(--muted);background:var(--surface);border-radius:10px;padding:0 7px;font-weight:600}
.kdrop{display:flex;flex-direction:column;gap:8px;min-height:60px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;cursor:grab;display:flex;flex-direction:column;gap:8px}
.kc:hover{border-color:var(--line2);box-shadow:0 4px 14px rgba(20,44,101,.08)}
.kc.drag{opacity:.45}
.kc b{font-size:13.5px;color:var(--ink);font-weight:600;line-height:1.4}
.kc-t{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.kc-t .tag{margin:0}

@media (max-width:959px){.kboard{grid-template-columns:repeat(4,86%);scroll-snap-type:x mandatory;margin:0 calc(var(--pad) * -1);padding:0 var(--pad) 6px}.kcol{scroll-snap-align:start}}

/* agenda */

.ag-tg{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.ag-tg label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.ag-tg input{width:16px;height:16px;accent-color:var(--blue)}
.ag-tg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}

.cd.out{background:var(--surface2)}.cd.out .n,.cd.out .ch{opacity:.55}
.cd.today .n{background:var(--blue);color:#fff;width:28px}
.ch{font-size:12px;line-height:1.35;padding:2px 7px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;color:var(--text);background:var(--surface2);border-left:3px solid var(--c,var(--faint))}

@media (max-width:700px){.cd{min-height:58px;padding:3px;align-items:center}.ch{display:none}.cd .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.cd .dots i{width:6px;height:6px;border-radius:50%}.cal .wd{font-size:10.5px;padding:8px 2px}}
@media (min-width:701px){.cd .dots{display:none}}
.ag-it{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}

.ag-it>div:last-child{min-width:0;flex:1;border-left:3px solid var(--c,var(--faint));padding-left:10px}.ag-it b.t{display:block;font-size:14px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-links{display:flex;gap:8px;flex-wrap:wrap}

/* modais */
#ov{position:fixed;inset:0;background:rgba(5,10,25,.5);z-index:60}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);border-radius:18px;z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.lg{width:min(760px,calc(100vw - 24px))}
.modal.cmd{top:12vh;transform:translateX(-50%);width:min(640px,calc(100vw - 24px));max-height:76vh}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(540px,100vw);background:var(--surface);z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow);border-left:1px solid var(--line)}

.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label,.f .lb{font-size:12.5px;font-weight:600;color:var(--ink)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.f2,.f3{grid-template-columns:1fr}}
.qd{display:flex;gap:6px;flex-wrap:wrap}.qd button{height:26px;padding:0 9px;border-radius:13px;background:var(--neu-bg);color:var(--muted);font-size:12px;font-weight:600}.qd button:hover{background:var(--sky);color:var(--blue)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}.kv span{display:block;font-size:11.5px;color:var(--muted)}.kv b{font-size:13.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sec h4{font-size:13.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.desc{font-size:14px;white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.com{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.com .who{display:flex;gap:8px;align-items:center;font-size:12.5px}.com .who b{color:var(--ink)}.com .who span{color:var(--muted)}
.com p{font-size:14px;margin-top:3px;white-space:pre-wrap;word-break:break-word}
.tl-i{display:flex;gap:12px;padding:5px 0}.tl-i i{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:6px;flex:none}.tl-i i.ok{background:var(--ok)}
.subs{display:flex;flex-direction:column;gap:2px}
.sbi{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
.sbi:hover{background:var(--hover)}
.sbi input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue);flex:none}
.sbi span{flex:1;min-width:0;font-size:14px}.sbi.ok span{text-decoration:line-through;color:var(--faint)}
.addl{display:flex;gap:8px}.addl .inp{flex:1}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.fl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;position:relative;cursor:pointer}

.fl .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:6px;background:var(--surface);display:grid;place-items:center;color:var(--crit)}
.fl .x svg{width:13px;height:13px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;display:block}
.drop:hover,.drop.over{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.drop input{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 4px;border-radius:14px;background:var(--sky);color:var(--blue);font-size:12.5px;font-weight:600}
.chip button{width:18px;height:18px;border-radius:9px;display:grid;place-items:center;color:inherit}.chip button svg{width:12px;height:12px}
.chip.add{background:transparent;border:1px dashed var(--line2);color:var(--muted);padding:0 10px;cursor:pointer}
.chip.add:hover{border-color:var(--blue);color:var(--blue)}
.mbox{position:relative}
.mlist{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:70;max-height:220px;overflow-y:auto;padding:4px}
.mlist button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 9px;border-radius:8px;text-align:left;font-size:13.5px}
.mlist button:hover,.mlist button.on{background:var(--hover)}
.mlist small{color:var(--muted);font-size:12px;margin-left:auto}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--sky);color:var(--blue);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.copy{display:flex;gap:8px}.copy .inp{flex:1;font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* comando e IA */
.cmd-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cmd-in svg{color:var(--blue);width:20px;height:20px}
.cmd-in input{flex:1;border:0;background:none;font-size:16px;outline:none;min-width:0;color:var(--ink)}
.cmd-l{overflow-y:auto;padding:6px}
.cmd-g{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.cmd-o{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:9px;text-align:left;font-size:14px}
.cmd-o:hover,.cmd-o.on{background:var(--hover)}
a.cmd-o{text-decoration:none;color:inherit}a.cmd-o>svg{color:var(--faint)}
.cmd-o .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sky);color:var(--blue);flex:none}
.cmd-o .ico svg{width:16px;height:16px}
.cmd-o div{min-width:0;flex:1}.cmd-o b{display:block;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cmd-o span{font-size:12.5px;color:var(--muted)}
.cmd-o kbd{font:600 11px Inter,sans-serif;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--muted)}
.ans{margin:6px 10px 10px;padding:14px 16px;border-radius:12px;background:var(--sky);font-size:14.5px;line-height:1.6;color:var(--text)}
.ans .pts svg{color:var(--blue)}
.cmd-f{border-top:1px solid var(--line);padding:9px 16px;font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}

/* tour */
.tour-hl{position:fixed;z-index:90;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,10,25,.6),0 0 0 3px var(--cyan);pointer-events:none;transition:all .25s ease}
.tour-tip{position:fixed;z-index:91;width:min(340px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px}
.tour-tip h4{font-size:15.5px;margin-bottom:6px}.tour-tip p{font-size:14px;color:var(--text)}
.tour-tip .row{margin-top:14px}
.tour-tip .dots{display:flex;gap:4px}.tour-tip .dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}.tour-tip .dots i.on{background:var(--blue)}

/* manual */
.man{display:grid;grid-template-columns:240px minmax(0,1fr);gap:var(--gap);align-items:start}
.man nav{position:sticky;top:80px;display:flex;flex-direction:column;gap:2px}
.man nav a{padding:8px 12px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center}
.man nav a svg{width:16px;height:16px}
.man nav a:hover{background:var(--hover);color:var(--ink)}
.man details{border-bottom:1px solid var(--line)}
.man details:last-child{border-bottom:0}
.man summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:12px;font-weight:600;color:var(--ink)}
.man summary::-webkit-details-marker{display:none}
.man summary .ch2{margin-left:auto;transition:transform .15s;color:var(--faint)}
.man details[open] summary .ch2{transform:rotate(180deg)}
.man .tx2{padding:0 18px 16px 58px;font-size:14px;color:var(--text);display:flex;flex-direction:column;gap:8px}
.man .tx2 ul{padding-left:18px;display:flex;flex-direction:column;gap:4px}
.man .sico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sky);color:var(--blue);flex:none}.man .sico svg{width:16px;height:16px}
@media (max-width:900px){.man{grid-template-columns:1fr}.man nav{display:none}.man .tx2{padding-left:18px}}

#toasts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#0B1838;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(10,20,50,.25)}
.toast.err{background:#B33434}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line2);border-top-color:var(--blue);animation:r .8s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
@media (max-width:959px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 13px}.tabs .search{display:none}.filters>*{flex:1 1 140px}.filters .search .sel{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function mini(A){
  const W = 300, H = 52;
  const t0 = T(A.ini), t1 = T(A.fim > A.h ? A.fim : A.h) + DIA, X = d => 2 + (T(d) - t0) / (t1 - t0) * (W - 4), Y = v => H - 3 - v / 100 * (H - 8);
  const pts = []; for (let t = t0; t <= t1; t += 4 * DIA) pts.push(iso(t));
  const p = pts.map((d, i) => (i ? 'L' : 'M') + X(d).toFixed(1) + ' ' + Y(A.pv(d)).toFixed(1)).join('');
  const r = pts.filter(d => d <= A.h).concat([A.h]).map((d, i) => (i ? 'L' : 'M') + X(d).toFixed(1) + ' ' + Y(A.ev(d)).toFixed(1)).join('');
  return `<svg class="mini" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${p}" stroke="var(--plan)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/><path d="${r}" stroke="var(--real)" stroke-width="2.6" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
}
function ligarGrafico(){
  const el = $('#ch'); if (!el || !CH) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), gd = el.querySelector('#gd'), hv = el.querySelector('#hv');
  const mover = e => {
    const r = svg.getBoundingClientRect(), sc = r.width / CH.W, cx = (e.touches ? e.touches[0].clientX : e.clientX), x = (cx - r.left) / sc;
    const t = clamp(CH.t0 + (x - CH.L) / CH.pw * (CH.t1 - CH.t0), CH.t0, CH.t1), d = iso(Math.round(t / DIA) * DIA), A = CH.A;
    gd.setAttribute('x1', CH.X(d)); gd.setAttribute('x2', CH.X(d)); gd.setAttribute('opacity', '.4');
    tip.hidden = false; tip.innerHTML = `<b>${brc(d)}</b><br>Planejado ${pct(A.pv(d))}` + (d <= A.h ? `<br>Realizado ${pct(A.ev(d))}` : '');
    tip.style.left = clamp(CH.X(d) * sc, tip.offsetWidth / 2, r.width - tip.offsetWidth / 2) + 'px'; tip.style.top = (CH.Y(100) * sc + 6) + 'px';
  };
  hv.addEventListener('mousemove', mover); hv.addEventListener('touchmove', mover, {passive:true});

}

function ligarQuadro(){

async function moverEstado(id, novo){

const MEN = {};
function ligarMencao(pref){
  const ta = document.getElementById(pref + '-x'), ml = document.getElementById(pref + '-ml'); if (!ta) return;
  MEN[pref] = MEN[pref] || [];
  const pinta = () => { const ch = document.getElementById(pref + '-ch'); if (ch) ch.innerHTML = MEN[pref].map(id => { const p = pessoa(id); return p ? `<span class="chip"><span class="av xs">${ini(p.nome)}</span>${esc(p.nome.split(' (')[0])}<button type="button" data-a="men-tira" data-id="${pref}|${id}" aria-label="Remover">${ICO.x}</button></span>` : ''; }).join('') + `<button type="button" class="chip add" data-a="men-add" data-id="${pref}">${isvg('at', 13)}Mencionar</button>`; };
  MEN['_p' + pref] = pinta; pinta();
  let sel = 0;
  const lista = () => { const v = ta.value.slice(0, ta.selectionStart), m = v.match(/@([\p{L}.]*)$/u); if (!m){ ml.hidden = true; return; } const q = norm(m[1]); const ps = PESSOAS.filter(p => p.user_id !== USER.id && (norm(p.nome).includes(q) || norm(p.email).startsWith(q))).slice(0, 6);
    if (!ps.length){ ml.hidden = true; return; } sel = Math.min(sel, ps.length - 1); ml.hidden = false; ml.innerHTML = ps.map((p, i) => `<button type="button" class="${i === sel ? 'on' : ''}" data-a="men-esc" data-id="${pref}|${p.user_id}"><span class="av xs">${ini(p.nome)}</span>${esc(p.nome)}<small>${esc(p.email)}</small></button>`).join(''); };
  ta.addEventListener('input', () => { sel = 0; lista(); });
  ta.addEventListener('keydown', e => { if (ml.hidden) return; const n = ml.children.length; if (e.key === 'ArrowDown'){ e.preventDefault(); sel = (sel + 1) % n; lista(); } else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = (sel - 1 + n) % n; lista(); } else if (e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); ml.children[sel].click(); } else if (e.key === 'Escape'){ ml.hidden = true; } });
  ta.addEventListener('blur', () => setTimeout(() => { ml.hidden = true; }, 200));
}

const TOUR = [

let TOURI = -1;
function tour(i = 0){
  if (rota().r !== 'hoje' && i === 0){ ir('hoje'); setTimeout(() => tour(0), 120); return; }
  fechar(); document.body.classList.remove('sb-open');
  $$('.tour-hl,.tour-tip').forEach(e => e.remove());
  if (i < 0 || i >= TOUR.length){ TOURI = -1; LS.set('tripro-tour', '1'); return; }
  TOURI = i; const [sel, t, txt] = TOUR[i];
  if (sel === '[data-tour="menu"]' || sel === '[data-tour="ajuda"]'){ if (!matchMedia('(min-width:960px)').matches) document.body.classList.add('sb-open'); }
  const el = document.querySelector(sel); const r = el && el.getBoundingClientRect();
  const vis = r && r.width > 0 && r.height > 0;
  if (vis && (r.top < 70 || r.bottom > innerHeight)) el.scrollIntoView({block:'center'});
  setTimeout(() => {
    const r2 = vis ? el.getBoundingClientRect() : null;
    const hl = document.createElement('div'); hl.className = 'tour-hl';
    if (r2){ Object.assign(hl.style, {left:(r2.left - 6) + 'px', top:(r2.top - 6) + 'px', width:(r2.width + 12) + 'px', height:Math.min(r2.height + 12, innerHeight - 20) + 'px'}); }
    else Object.assign(hl.style, {left:'50%', top:'50%', width:'0', height:'0'});
    const tp = document.createElement('div'); tp.className = 'tour-tip'; tp.setAttribute('role', 'dialog');
    tp.innerHTML = `<div class="dots" style="margin-bottom:10px">${TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><h4>${esc(t)}</h4><p>${esc(txt)}</p><div class="row" style="flex-wrap:nowrap"><span class="sub">${i + 1} de ${TOUR.length}</span><span class="sp"></span><button class="btn btn-sm btn-g" data-a="tour-fim">Pular</button>${i ? '<button class="btn btn-sm" data-a="tour-ant">Voltar</button>' : ''}<button class="btn btn-sm btn-p" data-a="tour-prox">${i === TOUR.length - 1 ? 'Concluir' : 'Próximo'}</button></div>`;
    document.body.append(hl, tp);
    const w = tp.offsetWidth, hh = tp.offsetHeight;
    let x = r2 ? r2.left : (innerWidth - w) / 2, y = r2 ? r2.bottom + 14 : (innerHeight - hh) / 2;
    if (r2 && y + hh > innerHeight - 10) y = r2.top - hh - 14;
    if (r2 && y < 10){ y = clamp(r2.top, 10, innerHeight - hh - 10); x = r2.right + 14; if (x + w > innerWidth - 10) x = r2.left - w - 14; }
    tp.style.left = clamp(x, 10, innerWidth - w - 10) + 'px'; tp.style.top = clamp(y, 10, innerHeight - hh - 10) + 'px';
  }, vis ? 180 : 0);
}

window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PROMPT = e; });
window.addEventListener('appinstalled', () => { PROMPT = null; toast('TRIPRO instalado.'); });
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
async function instalar(){
  if (instalado()){ toast('O TRIPRO já está instalado neste aparelho.'); return; }
  if (PROMPT){ PROMPT.prompt(); const r = await PROMPT.userChoice; if (r.outcome === 'accepted') PROMPT = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  abrir(`${cab('Instalar o TRIPRO')}<div class="mb">${ios
    ? `<p>No iPhone ou iPad, pelo <b>Safari</b>:</p><div class="steps"><div><span>Toque em <b>Compartilhar</b> (o quadrado com a seta para cima).</span></div><div><span>Escolha <b>Adicionar à Tela de Início</b>.</span></div><div><span>Toque em <b>Adicionar</b>.</span></div></div>`
    : `<p>No Android ou no computador, pelo <b>Chrome</b> ou <b>Edge</b>:</p><div class="steps"><div><span>Abra o menu do navegador (os três pontinhos no canto).</span></div><div><span>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</span></div><div><span>Confirme. O TRIPRO abre em janela própria.</span></div></div>`}
    <p class="sub">É o mesmo site, sempre atualizado. Não precisa de loja de aplicativos.</p></div>`);
}

/* ---------- fluxo ---------- */
async function recarregar(silencioso){ try { await API.carregar(); if (!silencioso || !$('#dlg')) render(); } catch (e){ toast('Erro ao carregar: ' + e.message, true); } }
let canal = null, iniciando = false;
async function iniciar(){ if (iniciando) return; iniciando = true; try { await iniciar2(); } finally { iniciando = false; } }
async function iniciar2(){
  if (LG.recup) return render();
  if (!(await API.sessao())) return render();
  ME = await API.meuCadastro() || {status:'pendente'};
  if (ME.status !== 'aprovado') return render();
  await API.carregar(); if (UI.pj !== 'all' && !projeto(UI.pj)) setPj('all'); render();
  if (!LS.get('tripro-tour')) setTimeout(() => tour(0), 600);
  if (!DEMO && !canal){ let tm; canal = sb.channel('tripro').on('postgres_changes', {event:'*', schema:'public'}, ev => { clearTimeout(tm); tm = setTimeout(async () => { if ($('#dlg') || UI.pop || TOURI >= 0){ await API.carregar(); return; } recarregar(true); }, 700); if (ev.table === 'notificacoes' && ev.eventType === 'INSERT') toast('Nova notificação: ' + ((ev.new && ev.new.titulo) || '')); }).subscribe(); }
}
const largo = () => matchMedia('(min-width:960px)').matches;
function render(){
  const r = $('#root');
  if (!USER || LG.recup){ r.innerHTML = telaLogin(); ligarLogin(); return; }
  if (!ME || ME.status === 'pendente'){ r.innerHTML = telaEstado('pendente'); return; }
  if (ME.status === 'bloqueado'){ r.innerHTML = telaEstado('bloqueado'); return; }
  const sy = scrollY, R = rota();
  r.innerHTML = {hoje:telaHoje, quadro:telaQuadro, agenda:telaAgenda, sprints:telaSprints, projetos:telaProjetos, entregas:telaEntregas, conversas:telaConversas, usuarios:telaUsuarios, ajuda:telaAjuda, conta:telaConta}[R.r]();
  ligarGrafico(); if (R.r === 'quadro') ligarQuadro(); if (R.r === 'conversas'){ ligarMencao('nc'); ligarComentarioNovo(); }
  scrollTo(0, sy);
  if (UI.pop === 'pj'){ const i = document.querySelector('[data-f="pq"]'); if (i) i.focus(); }
}
function ligarComentarioNovo(){
  const f = $('#fnc'); if (!f) return;
  f.addEventListener('submit', async e => { e.preventDefault(); const tid = $('#nc-t').value; if (!tid){ toast('Escolha a tarefa do comentário.', true); return; }
    try { if (await enviarComentario('nc', tid)){ await recarregar(); } } catch (err){ toast('Não foi possível comentar: ' + err.message, true); } });
}
window.addEventListener('hashchange', () => { Object.assign(UI, {mod:'all', resp:'all', st:'all', q:'', pop:null}); if (TOURI < 0) fechar(); document.body.classList.remove('sb-open'); if (USER && ME && ME.status === 'aprovado'){ render(); scrollTo(0, 0); } });
window.addEventListener('resize', () => { if (TOURI >= 0) tour(TOURI); });
if (LS.get('tripro-menu') === 'mini') document.body.classList.add('sb-mini');

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]');
  if (UI.pop && !e.target.closest('#psw') && !e.target.closest('#nt-w')){ UI.pop = null; if (!el || !['pj','notif-abrir','notif-ler'].includes(el.dataset.a)){ render(); return; } }
  if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox')) return;
  try {
    switch (a){
      case 'lg': LG.modo = id; LG.msg = ''; render(); { const i = $('#lg-e') || $('#lg-n'); if (i) i.focus(); } break;
      case 'entrar': { const b = $('#gbtn'); b.disabled = true; $('#gi').innerHTML = '<span class="spin"></span>'; $('#gtx').textContent = 'Redirecionando para o Google…';
        try { await API.entrar(); } catch (err){ b.disabled = false; $('#gtx').textContent = 'Continuar com Google'; $('#gi').innerHTML = iconeG(); aviso(traduz(err.message || String(err))); } break; }
      case 'sair': fechar(); await API.sair(); break;
      case 'recarregar': location.reload(); break;
      case 'sb': if (largo()){ const m = document.body.classList.toggle('sb-mini'); LS.set('tripro-menu', m ? 'mini' : 'full'); } else document.body.classList.toggle('sb-open'); break;
      case 'sb-fechar': document.body.classList.remove('sb-open'); break;
      case 'tema': trocarTema(); break;
      case 'tema-set': if (id === 'auto'){ delete document.documentElement.dataset.theme; LS.set('tripro-tema', ''); } else { document.documentElement.dataset.theme = id; LS.set('tripro-tema', id); } render(); break;
      case 'pop': UI.pop = UI.pop === id ? null : id; render(); break;
      case 'pop-fechar': UI.pop = null; break;
      case 'pj': { e.preventDefault(); UI.pop = null; setPj(id); render(); scrollTo(0, 0); break; }
      case 'pj-abrir': setPj(id); if (rota().r !== 'projetos') ir('projetos'); else render(); scrollTo(0, 0); break;
      case 'go': ir(id); break;
      case 'ir-atrasadas': UI.st = 'late'; if (rota().r === 'entregas') render(); else { location.hash = '/entregas'; setTimeout(() => { UI.st = 'late'; render(); }, 30); } break;
      case 'quadro-resp': UI.qr = id; ir('quadro'); break;
      case 'notif': UI.pop = 'nt'; render(); break;
      case 'notif-ler': await API.lerNotif(NOTIF.filter(n => !n.lida).map(n => n.id)); NOTIF.forEach(n => n.lida = true); UI.pop = null; render(); break;
      case 'notif-abrir': { const n = NOTIF.find(k => k.id == id); UI.pop = null; if (n && !n.lida){ await API.lerNotif([n.id]); n.lida = true; } render(); if (n && n.tarefa_id) gavetaTarefa(n.tarefa_id); else if (n && n.evento_id) modalEvento(n.evento_id); break; }
      case 'fechar': fechar(); break;
      case 'cmd': abrirCmd(); break;
      case 'cmd-ia': abrirCmd(''); setTimeout(() => { const i = $('#cmd-i'); if (i){ i.placeholder = 'Pergunte, por exemplo: o que está atrasado no CRM?'; } }, 0); break;
      case 'cmd-op': { const o = CMD.ops[+id]; if (o) o.a(e); break; }
      case 'resumo': { const b = $('#btn-resumo'); b.disabled = true; b.innerHTML = '<span class="spin" style="width:15px;height:15px"></span>'; try { await API.gerarResumo(); await recarregar(true); render(); toast('Resumo atualizado.'); } catch (err){ b.disabled = false; throw err; } break; }
      case 'avanco': modalAvanco(id); break;
      case 'a-q': $('#a-p').value = id; $('#a-r').value = id; break;
      case 'ver': e.stopPropagation(); gavetaTarefa(id); break;
      case 'tarefa-nova': { const d = el.closest('.kcol'); modalTarefa(null, d ? {estado:d.dataset.col === 'concluida' ? 'a_fazer' : d.dataset.col} : {}); break; }
      case 'tarefa-editar': modalTarefa(id); break;
      case 't-prazo': $('#t-f').value = id; if ($('#t-i').value > id) $('#t-i').value = id; break;
      case 'tarefa-excluir': if (el.dataset.ok){ await API.delTarefa(id); fechar(); toast('Tarefa excluída.'); await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Confirmar exclusão'; } break;
      case 'mt-aba': abaTM(id); break;
      case 'mt-sub-add': addSubTM(); break;
      case 'mt-sub-del': TM.subs.splice(+id, 1); pintarTM(); break;
      case 'mt-file-del': TM.files.splice(+id, 1); pintarTM(); break;
      case 'sub-del': { const s = D.subtarefas.find(k => k.id == id); await API.delSub(id); if (s) await avancoPelasSubs(s.tarefa_id); await recarregar(true); if (TM) pintarTM(); else if (GV) gavetaTarefa(GV); break; }
      case 'anexo-abrir': { if (e.target.closest('.x')) break; const ax = D.anexos.find(k => k.id == id); if (!ax) break; const w = window.open('', '_blank'); try { const u = await API.urlAnexo(ax); if (w) w.location = u; else location.href = u; } catch (err){ if (w) w.close(); throw err; } break; }
      case 'anexo-del': { e.stopPropagation(); const ax = D.anexos.find(k => k.id == id); if (!ax) break; if (!el.dataset.ok){ el.dataset.ok = '1'; el.style.background = 'var(--crit)'; el.style.color = '#fff'; toast('Toque de novo para excluir o anexo.'); break; } await API.delAnexo(ax); await recarregar(true); if (TM) pintarTM(); else gavetaTarefa(ax.tarefa_id); toast('Anexo excluído.'); break; }
      case 'projeto-novo': UI.pop = null; modalProjeto(); break;
      case 'projeto-editar': modalProjeto(id); break;
      case 'projeto-excluir': if (el.dataset.ok){ await API.delProjeto(id); fechar(); toast('Projeto excluído.'); setPj('all'); await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Excluir projeto e tarefas?'; } break;
      case 'com-excluir': if (el.dataset.ok){ await API.delComentario(id); await recarregar(true); if (GV) gavetaTarefa(GV); else render(); } else { el.dataset.ok = '1'; el.style.color = 'var(--crit)'; toast('Toque de novo para excluir o comentário.'); } break;
      case 'c-tab': UI.ctab = id; render(); break;
      case 'men-add': popMencao(id); break;
      case 'men-esc': { const [pref, uid] = id.split('|'); escolherMencao(pref, uid); break; }
      case 'men-tira': { const [pref, uid] = id.split('|'); MEN[pref] = MEN[pref].filter(k => k !== uid); MEN['_p' + pref](); break; }
      case 'sprint-nova': modalSprint(); break;
      case 'sprint-editar': e.stopPropagation(); modalSprint(id); break;
      case 's-dur': $('#s-f').value = iso(T($('#s-i').value) + (+id) * DIA); break;
      case 'sprint-excluir': if (el.dataset.ok){ await API.delSprint(id); fechar(); toast('Sprint excluída. As tarefas voltaram ao backlog.'); UI.qs = null; await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Confirmar exclusão'; } break;
      case 'sprint-iniciar': e.stopPropagation(); await API.saveSprint({status:'ativa'}, id); UI.qs = String(id); toast('Sprint iniciada.'); await recarregar(); break;
      case 'sprint-concluir': e.stopPropagation(); modalConcluirSprint(id); break;
      case 'sprint-concluir-ok': { const dst = $('#cs-d') ? $('#cs-d').value : '', sobra = D.tarefas.filter(x => x.sprint_id == id && x.estado !== 'concluida').map(x => x.id);
        await API.setTarefas(sobra, {sprint_id:dst ? +dst : null}); await API.saveSprint({status:'concluida'}, id); if (dst) await API.saveSprint({status:'ativa'}, dst); UI.qs = null; fechar(); toast('Sprint concluída.'); await recarregar(); break; }
      case 'sprint-puxar': { const s = sprintDe(id), ids = D.tarefas.filter(x => !x.sprint_id && x.estado !== 'concluida' && noFiltro(x) && x.fim_previsto <= s.fim).map(x => x.id); await API.setTarefas(ids, {sprint_id:+id}); toast(`${ids.length} tarefa${ids.length > 1 ? 's' : ''} na ${s.nome}.`); await recarregar(); break; }
      case 'mes': UI.mes = id; render(); break;
      case 'dia': if (e.target.closest('.ch:not(.more)')) break; modalDia(id); break;
      case 'ev-novo': modalEvento(null, id); break;
      case 'ev-ver': e.stopPropagation(); modalEvento(id); break;
      case 'ev-p-tira': EVP = EVP.filter(k => k !== id); MEN._evp(); break;
      case 'ev-excluir': if (el.dataset.ok){ await API.delEvento(id); fechar(); toast('Evento excluído.'); await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Confirmar exclusão'; } break;
      case 'ev-ics': baixarIcs(D.eventos.find(k => k.id == id)); break;
      case 'agenda-sync': modalSync(false); break;
      case 'sync-ok': setTimeout(() => toast('Confirme na tela que abriu. A agenda TRIPRO aparece em alguns minutos.'), 300); break;
      case 'agenda-novo-link': if (el.dataset.ok){ modalSync(true); } else { el.dataset.ok = '1'; el.textContent = 'O link antigo para de funcionar. Confirmar?'; } break;
      case 'copiar': { const i = $('#ics-url'); i.select(); try { await navigator.clipboard.writeText(i.value); } catch (x){ document.execCommand('copy'); } el.textContent = 'Copiado'; break; }
      case 'pref': { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', String(on));
        const c = id === 'c' ? on : !!ME.receber_conclusoes, r = id === 'r' ? on : !!ME.receber_resumo;
        try { await API.preferencias(c, r); toast('Preferência salva.'); } catch (err){ el.setAttribute('aria-checked', String(!on)); throw err; } break; }
      case 'u-tab': UI.utab = id; render(); break;
      case 'u-convidar': modalConvite(); break;
      case 'u-link': { try { await navigator.clipboard.writeText(location.origin + location.pathname); toast('Link do TRIPRO copiado. Envie para a pessoa.'); } catch (x){ toast(location.origin + location.pathname); } break; }
      case 'u-conv-del': await API.delConvite(id); await recarregar(true); render(); toast('Convite removido.'); break;
      case 'u-aprovar': { const s = document.getElementById('papel-' + id), papel = s ? s.value : null;
        await API.setMembro(id, {status:'aprovado', aprovado_em:new Date().toISOString(), aprovado_por:USER.email, ...(papel ? {papel} : {})}); await recarregar(true); render(); toast(UI.utab === 'bloqueado' ? 'Acesso desbloqueado.' : 'Acesso aprovado. A pessoa foi notificada.'); break; }
      case 'u-rejeitar': await API.setMembro(id, {status:'bloqueado'}); await recarregar(true); render(); toast('Pedido rejeitado. Ele fica em Bloqueados.'); break;
      case 'u-bloquear': if (el.dataset.ok){ await API.setMembro(id, {status:'bloqueado'}); await recarregar(true); render(); toast('Acesso bloqueado.'); } else { el.dataset.ok = '1'; el.lastChild.textContent = 'Confirmar'; } break;
      case 'u-remover': if (el.dataset.ok){ await API.delMembro(id); await recarregar(true); render(); toast('Pessoa removida da lista.'); } else { el.dataset.ok = '1'; el.lastChild.textContent = 'Confirmar'; } break;
      case 'tour': tour(0); break;
      case 'tour-prox': tour(TOURI + 1); break;
      case 'tour-ant': tour(TOURI - 1); break;
      case 'tour-fim': tour(-1); $$('.tour-hl,.tour-tip').forEach(k => k.remove()); document.body.classList.remove('sb-open'); break;
      case 'man-ir': { e.preventDefault(); const d = document.getElementById('m-' + id); if (d){ d.open = true; d.scrollIntoView({behavior:'smooth', block:'start'}); } break; }
      case 'instalar': e.preventDefault(); await instalar(); break;
    }
  } catch (err){ toast('Não foi possível concluir: ' + err.message, true); }
});
document.addEventListener('change', async e => {
  const el = e.target, f = el.dataset.f;
  if (f && f.startsWith('ag.')){ const k = f.slice(3); if (k === 'sit') UI.ag.sit = el.value === 'abertas' ? ['plan','run','rev','late'] : el.value === 'late' ? ['late'] : ['plan','run','rev','late','ok']; else UI.ag[k] = el.value; render(); return; }
  if (f && !['q','uq','qq','pq','pq2'].includes(f)){ UI[f] = el.value; render(); return; }
  try {
    if (el.dataset.a === 'ag-tg'){ UI.ag[el.dataset.id] = el.checked; render(); }
    if (el.dataset.a === 'u-papel'){ await API.setMembro(el.dataset.id, {papel:el.value}); toast('Papel atualizado.'); await recarregar(true); render(); }
    if (el.dataset.a === 'mover') await moverEstado(el.dataset.id, el.value);
    if (el.dataset.a === 'sprint-mover' && el.value){ await API.setTarefa(el.dataset.id, {sprint_id:+el.value}); toast('Tarefa adicionada à ' + sprintDe(el.value).nome + '.'); await recarregar(); }
    if (el.dataset.a === 'sub-ok'){ const s = D.subtarefas.find(k => k.id == el.dataset.id); await API.setSub(el.dataset.id, {feito:el.checked}); el.closest('.sbi').classList.toggle('ok', el.checked); if (s) await avancoPelasSubs(s.tarefa_id); await recarregar(true); if (GV) gavetaTarefa(GV); else if (!$('#dlg')) render(); }
  } catch (err){ toast(err.message, true); }
});
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f;
  if (f === 'pq'){ const q = norm(el.value).trim(); let n = 0; $$('.pop .pi').forEach(b => { const v = !q || b.dataset.busca.includes(q); b.hidden = !v; n += v; }); $('#pq-nada').hidden = !!n; return; }
  if (['q','uq','qq','pq2'].includes(f)){ UI[f] = el.value; const p = el.selectionStart; render(); const n = document.querySelector(`[data-f="${f}"]`); if (n){ n.focus(); n.setSelectionRange(p, p); } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (TOURI >= 0){ tour(-1); $$('.tour-hl,.tour-tip').forEach(k => k.remove()); return; } if (UI.pop){ UI.pop = null; render(); return; } fechar(); document.body.classList.remove('sb-open'); }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f === 'pq'){ const b = $$('.pop .pi').find(k => !k.hidden); if (b) b.click(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && USER && ME && ME.status === 'aprovado'){ e.preventDefault(); abrirCmd(); }
});
if ('serviceWorker' in navigator && !DEMO && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

{ const q = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, '')), er = q.get('error_description'); if (er){ LG.msg = traduz(er.replace(/\+/g, ' ')); history.replaceState(null, '', location.pathname); } }
if (!DEMO){
  if (!window.supabase){ document.getElementById('root').innerHTML = '<div class="auth"><section class="a-r" style="grid-column:1/-1"><div class="a-box"><h2>Não foi possível carregar</h2><p class="s">Verifique a conexão com a internet e atualize a página.</p></div></section></div>'; }
  else { sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {auth:{flowType:'pkce', detectSessionInUrl:true, persistSession:true}});
    fetch(CONFIG.SUPABASE_URL + '/auth/v1/settings', {headers:{apikey:CONFIG.SUPABASE_KEY}}).then(r => r.json()).then(j => { LG.google = !!(j.external && j.external.google); if (!USER) render(); }).catch(() => {});
    sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY'){ LG.recup = true; LG.msg = ''; render(); return; } if (ev === 'SIGNED_IN' && !ME && !LG.recup) iniciar(); if (ev === 'SIGNED_OUT'){ USER = null; ME = null; render(); } });
    iniciar(); }
} else { render(); }
