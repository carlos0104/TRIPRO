<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRIPRO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="TRIPRO · acompanhamento dos projetos da Trium com Curva S, prazos e entregas">
<meta name="theme-color" content="#142C65">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TRIPRO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#142C65;--navy2:#1B3677;--blue:#2453AB;--light:#8BC4FF;--sky:#F1F6FF;
  --bg:#F6F8FC;--surface:#fff;--ink:#142C65;--text:#24304D;--muted:#6B7A99;--faint:#9AA6BF;--line:#E6ECF5;--line2:#D6E0F0;
  --ok:#17845A;--ok-bg:#E7F6EF;--crit:#C83B3B;--crit-bg:#FCECEC;--warn:#B7700F;--warn-bg:#FFF4E2;--neu-bg:#EEF2F8;
  --plan:#A9B5CC;--real:#2453AB;--proj:#4E8FE0;
  --r:12px;--sbw:256px;--sbm:76px;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue)}
h1,h2,h3{color:var(--ink);letter-spacing:-.01em}
.tn{font-variant-numeric:tabular-nums}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
:focus-visible{outline:2px solid var(--light);outline-offset:2px}

/* ---------- marca ---------- */
.lockup{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.lockup svg{flex:none}

/* ---------- login ---------- */
.auth{display:grid;grid-template-columns:minmax(0,54fr) minmax(0,46fr);min-height:100vh;min-height:100dvh;background:#fff}
.a-l{background:radial-gradient(900px 600px at 0% 0%,rgba(139,196,255,.10),transparent 60%),var(--navy);color:#fff;padding:clamp(32px,5vw,76px) clamp(28px,5vw,96px) clamp(28px,4vw,56px);display:flex;flex-direction:column}
.a-l .lockup{font-size:clamp(22px,1.7vw,30px)}
.a-l .lockup svg{width:clamp(44px,3vw,58px);height:auto}
.a-copy{margin:auto 0;padding:48px 0 40px}
.a-copy h1{color:#fff;font-size:clamp(34px,3.3vw,61px);line-height:1.15;letter-spacing:-.025em;font-weight:700}
.a-copy p{font-size:clamp(16px,1.2vw,22px);line-height:1.6;color:#C2D3F2;margin-top:22px;max-width:34ch}
.path{margin-top:clamp(28px,3.5vw,56px);border-radius:22px;background:rgba(255,255,255,.055);border:1px solid rgba(139,196,255,.2);padding:clamp(22px,2vw,40px) clamp(18px,2.3vw,44px);max-width:840px}
.path .eb{font-size:12.5px;font-weight:600;letter-spacing:.16em;color:#9FB8E6;text-transform:uppercase}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(20px,2vw,36px);position:relative}
.steps3::before{content:"";position:absolute;left:16.7%;right:16.7%;top:clamp(21px,1.8vw,34px);border-top:2px dashed rgba(139,196,255,.35)}
.st{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.st .c{width:clamp(42px,3.6vw,68px);height:clamp(42px,3.6vw,68px);border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,1.1vw,21px);font-weight:600;background:#1D3B7E;color:#C2D3F2;box-shadow:0 0 0 7px #18336F}
.st.on .c{background:var(--blue);color:#fff;box-shadow:0 0 0 7px #18336F,0 0 0 9px var(--light)}
.st b{font-size:clamp(14px,1.15vw,22px);font-weight:600;margin-top:clamp(12px,1.2vw,22px)}
.st span{font-size:clamp(12px,.85vw,16px);color:#AFC2E8;margin-top:4px}
.a-foot{font-size:13.5px;color:#8FA6D6;letter-spacing:.04em}
.a-r{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px 28px;position:relative}
.a-box{width:100%;max-width:500px}
.a-box h2{font-size:clamp(28px,2.3vw,44px);font-weight:700;letter-spacing:-.02em}
.a-box .s{font-size:clamp(15px,1.05vw,20px);color:var(--muted);margin-top:8px}
.gbtn{margin-top:clamp(24px,2.7vw,52px);width:100%;height:clamp(54px,3.3vw,64px);border-radius:12px;border:1.5px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;gap:14px;font-size:clamp(16px,1.05vw,20px);font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(20,44,101,.06);transition:border-color .15s,box-shadow .15s,background .15s}
.gbtn:hover{border-color:var(--light);box-shadow:0 4px 14px rgba(36,83,171,.12)}
.gbtn:disabled{cursor:progress;background:#FAFCFF;color:var(--muted)}
.gbtn img{width:22px;height:22px}
.note{margin-top:16px;border-radius:12px;background:var(--sky);padding:14px 18px;display:flex;gap:12px;align-items:center;font-size:14.5px;line-height:1.5;color:#5B6B8C}
.note svg{flex:none;color:var(--blue)}
.a-sep{border:0;border-top:1px solid var(--line);margin:clamp(24px,2.3vw,44px) 0 clamp(16px,1.6vw,30px)}
.demo{text-align:center}.demo b{display:block;font-size:12px;letter-spacing:.16em;color:#8A97B2;font-weight:600}.demo span{display:block;font-size:14.5px;color:#7A88A6;margin-top:6px}
.a-rf{position:absolute;bottom:clamp(20px,3vw,60px);font-size:13px;color:var(--faint)}
.a-who{display:flex;align-items:center;gap:14px;margin-bottom:26px;padding:14px;border:1px solid var(--line);border-radius:14px}
.a-who b{display:block;color:var(--ink)}
.a-btns{display:flex;gap:10px;margin-top:26px}
.a-btns .btn{flex:1;height:48px}
@media (max-width:900px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .a-l{padding:32px 26px 28px}
  .a-copy{margin:0;padding:30px 0 0}
  .a-copy p{margin-top:10px}
  .a-copy .long{display:none}
  .st span,.a-foot{display:none}
  .path{margin-top:22px;padding:18px 14px 16px;border-radius:18px}
  .path .eb{font-size:11px;padding-left:6px}
  .st .c{box-shadow:0 0 0 5px #18336F}.st.on .c{box-shadow:0 0 0 5px #18336F,0 0 0 7px var(--light)}
  .a-r{justify-content:flex-start;padding:28px 26px 0}
  .a-rf{position:static;margin-top:auto;padding:28px 0 calc(20px + env(safe-area-inset-bottom))}
}
@media (min-width:901px){.a-copy .short{display:none}}

/* ---------- casca do app: menu lateral ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh;min-height:100dvh;transition:grid-template-columns .2s ease}
body.sb-mini .app{grid-template-columns:var(--sbm) minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;height:100dvh;background:var(--navy);color:#C9D7F2;display:flex;flex-direction:column;padding:20px 14px calc(16px + env(safe-area-inset-bottom));overflow:hidden;z-index:40}
.sb-h{display:flex;align-items:center;height:44px;padding:0 6px;margin-bottom:22px}
.sb-h .lockup{color:#fff;font-size:19px}
.sb nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden;flex:1;margin:0 -4px;padding:0 4px;scrollbar-width:none}
.sb .grp{font-size:11px;font-weight:600;letter-spacing:.14em;color:#7F97C9;text-transform:uppercase;padding:18px 12px 8px;white-space:nowrap}
.nl{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:#C9D7F2;text-decoration:none;font-size:14.5px;font-weight:500;white-space:nowrap;position:relative;transition:background .12s,color .12s}
.nl svg{flex:none;width:20px;height:20px}
.nl:hover{background:rgba(255,255,255,.06);color:#fff}
.nl.on{background:rgba(139,196,255,.14);color:#fff}
.nl.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--light)}
.nl .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--light);color:var(--navy);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nl.sm{height:36px;font-size:13.5px;padding-left:44px;color:#AFC2E8}
.nl.sm i{width:7px;height:7px;border-radius:50%;background:#4D6AA8;flex:none;margin-left:-20px;margin-right:4px}
.nl.sm.on i{background:var(--light)}
.sb-f{border-top:1px solid rgba(139,196,255,.14);padding-top:12px;margin-top:10px}
.me{display:flex;align-items:center;gap:11px;padding:8px 8px;border-radius:10px;text-decoration:none;color:#fff;white-space:nowrap}
.me:hover{background:rgba(255,255,255,.06)}
.me div{min-width:0}.me b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis}.me div span{display:block;font-size:12px;color:#9FB8E6}
body.sb-mini .sb .lbl,body.sb-mini .sb .grp,body.sb-mini .nl.sm,body.sb-mini .me div,body.sb-mini .sb-h .lockup span{display:none}
body.sb-mini .nl{justify-content:center;padding:0}
body.sb-mini .nl .bd{position:absolute;top:3px;right:6px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
body.sb-mini .sb .grp{display:block;height:14px;padding:0;font-size:0}
body.sb-mini .me{justify-content:center}
body.sb-mini .sb-h{justify-content:center;padding:0}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;height:64px;background:rgba(246,248,252,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 clamp(16px,3vw,36px);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.tg{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:#fff;flex:none}
.tg:hover{border-color:var(--line2)}
.crumb{min-width:0;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--blue)}
.content{padding:clamp(18px,3vw,36px);display:flex;flex-direction:column;gap:22px;max-width:1360px;width:100%}
.scrim{display:none}
@media (max-width:959px){
  .app,body.sb-mini .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;bottom:0;width:min(84vw,288px);transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(10,20,50,.3);padding-top:calc(20px + env(safe-area-inset-top))}
  body.sb-open .sb{transform:none}
  body.sb-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:35}
  body.sb-mini .sb .lbl,body.sb-mini .sb .grp,body.sb-mini .nl.sm,body.sb-mini .me div,body.sb-mini .sb-h .lockup span{display:revert}
  body.sb-mini .nl{justify-content:flex-start;padding:0 12px}body.sb-mini .nl.sm{padding-left:44px;display:flex}
  body.sb-mini .nl .bd{position:static;min-width:20px;height:20px;font-size:11.5px}
  body.sb-mini .sb .grp{height:auto;padding:18px 12px 8px;font-size:11px}
  body.sb-mini .me{justify-content:flex-start}body.sb-mini .sb-h{justify-content:flex-start;padding:0 6px}
  .hide-m,.tabs .search{display:none!important}
}

/* ---------- componentes ---------- */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph h1{font-size:clamp(22px,2vw,28px);font-weight:700}
.ph p{color:var(--muted);font-size:14.5px;margin-top:2px}
.btn{height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--light);background:#FAFCFF}
.btn-p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-p:hover{background:#1E4796;border-color:#1E4796}
.btn-d{color:var(--crit);border-color:#F1CACA}.btn-d:hover{background:var(--crit-bg);border-color:#E9A9A9}
.btn-g{border-color:transparent;background:transparent;color:var(--muted)}.btn-g:hover{background:var(--neu-bg);border-color:transparent}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn svg{width:17px;height:17px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15.5px;font-weight:600}
.card-b{padding:18px 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi b{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--crit)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-crit{background:var(--crit-bg);color:var(--crit)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-brand{background:var(--sky);color:var(--blue)}.p-neu{background:var(--neu-bg);color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--neu-bg);overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}.bar i.ok{background:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.pc{padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pc:hover{border-color:var(--line2);box-shadow:0 6px 22px rgba(20,44,101,.07)}
.pc h3{font-size:16px;font-weight:600}
.pc .d{font-size:13.5px;color:var(--muted);margin-top:-6px}
.pc svg{width:100%;height:64px}
.pc .m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pc .m span{display:block;font-size:11.5px;color:var(--muted)}.pc .m b{font-size:15px;color:var(--ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.li:last-child{border-bottom:0}
.li:hover b{color:var(--blue)}
.li>div{min-width:0;flex:1}
.li b{display:block;font-weight:600;color:var(--ink);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li span.sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--blue);background:var(--sky);border-radius:6px;padding:1px 7px;margin-right:7px;vertical-align:1px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sel,.inp{height:40px;border:1px solid var(--line2);border-radius:10px;background:#fff;padding:0 12px;font-size:14px;min-width:0}
.sel:focus,.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(139,196,255,.35)}
textarea.inp{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.search{position:relative}.search svg{position:absolute;left:11px;top:11px;color:var(--faint)}.search .sel{padding-left:36px;width:min(260px,100%)}
.tbl-w{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBFCFE}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:#FAFCFF}
tbody tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}
th.n,td.n{text-align:right}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line)}.chart .ax{fill:var(--faint);font-size:11px}
.tip{position:absolute;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;line-height:1.45}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px 24px}
.mod b{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink);font-weight:600;margin-bottom:7px}.mod b span{color:var(--muted);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:48px;height:48px;font-size:16px}
.sb .av{background:rgba(139,196,255,.18);color:#fff;width:34px;height:34px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{height:46px;padding:0 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab .ct{min-width:22px;height:20px;padding:0 6px;border-radius:10px;background:var(--neu-bg);font-size:12px;display:grid;place-items:center}
.tab.on .ct{background:var(--sky);color:var(--blue)}
.urow{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.urow:last-child{border-bottom:0}
.urow .who{flex:1;min-width:200px}
.urow .who b{display:block;color:var(--ink);font-weight:600}
.urow .who span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.urow .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.how div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.how i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--blue);font-style:normal;font-weight:700;font-size:12.5px;display:grid;place-items:center}
.how b{color:var(--ink);display:block;font-size:14px}
.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.fi:last-child{border-bottom:0}.fi:hover{background:#FAFCFF}
.fi .bx{min-width:0;flex:1}
.fi .meta{font-size:12.5px;color:var(--muted)}
.fi p{margin-top:4px;color:var(--text);font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.fi .ref{margin-top:6px;font-size:12.5px;color:var(--blue);font-weight:500}
.set{display:flex;gap:16px;align-items:flex-start;padding:16px 20px;border-bottom:1px solid var(--line)}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DIA = 864e5;
const T = d => Date.parse(d + 'T00:00:00Z');
const iso = ms => new Date(ms).toISOString().slice(0, 10);
const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const br = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '–';
const brc = d => d ? br(d) + '/' + d.slice(2, 4) : '–';
const pct = (v, dd = 1) => isFinite(v) ? v.toLocaleString('pt-BR', {minimumFractionDigits:dd, maximumFractionDigits:dd}) + '%' : '–';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ini = s => (String(s || '?').match(/\p{L}+/gu) || ['?']).slice(0, 2).map(x => x[0].toUpperCase()).join('');
const quando = ts => { const d = new Date(ts); return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}) + ' às ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}); };
const slug = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || ('p' + Date.now().toString(36));
function toast(m, err){ const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 4000); }
const LS = {get(k){ try { return localStorage.getItem(k); } catch (e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch (e){} }};

const ICO = {

  panel: ic('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/>'),

/* ---------- acesso aos dados (Supabase ou demonstração) ---------- */
let sb = null, USER = null, ME = null, MEMBROS = [], D = {projetos:[], tarefas:[], avancos:[], comentarios:[]};
const API = {
  async sessao(){
    if (DEMO){ if (!API._demoIn) return false; USER = {id:'demo-admin', email:'diretoria@trium.exemplo', user_metadata:{full_name:'Carlos (demonstração)'}}; return true; }
    const { data } = await sb.auth.getSession(); USER = data.session ? data.session.user : null; return !!USER;
  },
  async entrar(){
    if (DEMO){ API._demoIn = true; return iniciar(); }
    const { error } = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.origin + location.pathname}});
    if (error) throw error;
  },

  async meuCadastro(){ if (DEMO) return {status:'aprovado', papel:'admin', receber_conclusoes:true, receber_resumo:true, email:USER.email, nome:'Carlos (demonstração)'}; const { data } = await sb.from('membros').select('*').eq('user_id', USER.id).maybeSingle(); return data; },
  async carregar(){
    if (DEMO){ D = DEMO; MEMBROS = DEMO.membros || []; return; }
    const [p, t, a, c] = await Promise.all([
      sb.from('projetos').select('*').order('ordem').order('nome'),
      sb.from('tarefas').select('*').order('inicio_previsto').order('id'),
      sb.from('avancos').select('id,tarefa_id,data,percentual,observacao,autor,criado_em').order('data').order('id'),
      sb.from('comentarios').select('id,tarefa_id,texto,autor,autor_id,criado_em').order('criado_em'),
    ]);

    if (ME.papel === 'admin'){ const { data } = await sb.from('membros').select('*').order('criado_em', {ascending:false}); MEMBROS = data || []; }

/* ---------- cálculos ---------- */
function ultimo(id, ate){ let u = null; for (const v of D.avancos) if (v.tarefa_id === id && (!ate || v.data <= ate) && (!u || v.data >= u.data)) u = v; return u; }
const atual = id => (ultimo(id) || {percentual:0}).percentual;
function status(x, h){
  const p = atual(x.id);
  if (p >= 100) return ['Concluída', 'p-ok', 'ok'];
  if (x.fim_previsto < h) return ['Atrasada', 'p-crit', 'late'];
  if (x.inicio_previsto <= h) return p > 0 ? ['Em andamento', 'p-brand', 'run'] : ['Deveria ter começado', 'p-warn', 'run'];
  return ['Planejada', 'p-neu', 'plan'];
}
function analise(ts){
  if (!ts.length) return null;
  const h = hoje(), total = ts.reduce((s, x) => s + x.peso, 0) || 1;
  const pv = d => { const r = T(d); let s = 0; for (const x of ts){ const a = T(x.inicio_previsto), b = T(x.fim_previsto) + DIA; s += x.peso * clamp((r + DIA - a) / (b - a), 0, 1); } return s / total * 100; };
  const ev = d => { let s = 0; for (const x of ts){ const u = ultimo(x.id, d); s += x.peso * (u ? u.percentual / 100 : 0); } return s / total * 100; };
  const ini0 = ts.reduce((m, x) => x.inicio_previsto < m ? x.inicio_previsto : m, '9999'), fim = ts.reduce((m, x) => x.fim_previsto > m ? x.fim_previsto : m, '0000');
  const P = pv(h), R = ev(h), vel = (R - ev(iso(T(h) - 28 * DIA))) / 28;
  let prev = null;
  if (R >= 99.95) prev = h; else if (vel > 0.01) prev = iso(T(h) + Math.ceil((100 - R) / vel) * DIA);
  return {h, ini:ini0, fim, P, R, idp:P > 0 ? R / P : NaN, prev, pv, ev};
}
const tarefasDe = pid => D.tarefas.filter(x => x.projeto_id === pid);
const projetoDe = tid => { const t = D.tarefas.find(x => x.id === tid); return t ? D.projetos.find(p => p.id === t.projeto_id) : null; };
const semanaAtual = h => { const seg = iso(T(h) - ((new Date(T(h)).getUTCDay() + 6) % 7) * DIA); return [seg, iso(T(seg) + 6 * DIA)]; };
const ST_PROJ = {ativo:['Ativo','p-brand'], pausado:['Pausado','p-warn'], concluido:['Concluído','p-ok']};

/* ---------- gráficos ---------- */
let CH = null;
function curvaS(A){
  const W = 900, H = 340, L = 46, Rm = 24, Tp = 34, B = 34, pw = W - L - Rm, ph = H - Tp - B;
  const end = [A.fim, A.prev && A.prev < '2100' ? A.prev : null, A.h].filter(Boolean).reduce((m, x) => x > m ? x : m);
  const t0 = T(A.ini < A.h ? A.ini : iso(T(A.h) - 7 * DIA)), t1 = T(end) + 3 * DIA, X = d => L + (T(d) - t0) / (t1 - t0) * pw, Y = v => Tp + ph - v / 100 * ph;
  const pts = []; for (let t = t0; t <= t1; t += 3 * DIA) pts.push(iso(t));
  const plan = pts.map(d => [X(d), Y(A.pv(d))]);
  const real = pts.filter(d => d <= A.h).concat([A.h]).map(d => [X(d), Y(A.ev(d))]);
  const path = p => p.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
  let g = '';
  for (let k = 0; k <= 4; k++){ const y = Tp + ph - ph * k / 4; g += `<line class="gl" x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 8}" y="${y + 4}" text-anchor="end">${k * 25}%</text>`; }
  const step = Math.max(7, Math.ceil((t1 - t0) / DIA / 9 / 7) * 7);
  for (let t = t0; t <= t1; t += step * DIA) g += `<text class="ax" x="${X(iso(t))}" y="${H - 10}" text-anchor="middle">${br(iso(t))}</text>`;
  const hx = X(A.h), last = real[real.length - 1];
  let proj = '';
  if (A.prev && A.R < 99.95 && A.prev < '2100') proj = `<path d="M${last[0]} ${last[1]} L${X(A.prev)} ${Y(100)}" stroke="var(--proj)" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/><circle cx="${X(A.prev)}" cy="${Y(100)}" r="4.5" fill="var(--proj)"/><text class="ax" x="${X(A.prev)}" y="${Y(100) - 12}" text-anchor="${X(A.prev) > W - 120 ? 'end' : 'middle'}" style="fill:var(--proj);font-weight:600">previsão ${br(A.prev)}</text>`;
  CH = {X, t0, t1, L, pw, W, A, Y};
  return `<div class="chart" id="ch"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva S: planejado ${pct(A.P)} e realizado ${pct(A.R)} até hoje">${g}
    <line x1="${X(A.fim)}" x2="${X(A.fim)}" y1="${Tp}" y2="${Tp + ph}" stroke="var(--plan)" stroke-dasharray="2 4"/><text class="ax" x="${X(A.fim) - 6}" y="${Tp + ph - 8}" text-anchor="end">fim planejado ${br(A.fim)}</text>
    <path d="${path(plan)}" stroke="var(--plan)" stroke-width="2.2" fill="none"/>
    <path d="${path(real)} L${last[0]} ${Tp + ph} L${real[0][0]} ${Tp + ph}Z" fill="var(--real)" opacity=".08"/>
    <path d="${path(real)}" stroke="var(--real)" stroke-width="3" fill="none" stroke-linejoin="round"/>${proj}
    <line x1="${hx}" x2="${hx}" y1="${Tp}" y2="${Tp + ph}" stroke="var(--ink)" opacity=".3"/><text class="ax" x="${hx}" y="${Tp - 10}" text-anchor="middle" style="fill:var(--ink);font-weight:600">hoje</text>
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--real)" stroke="#fff" stroke-width="2"/>
    <line id="gd" x1="0" x2="0" y1="${Tp}" y2="${Tp + ph}" stroke="var(--ink)" stroke-dasharray="3 3" opacity="0"/><rect id="hv" x="${L}" y="${Tp}" width="${pw}" height="${ph}" fill="transparent"/></svg><div class="tip" hidden></div></div>`;
}
function mini(A){
  const W = 300, H = 64;
  const t0 = T(A.ini), t1 = T(A.fim > A.h ? A.fim : A.h) + DIA, X = d => 4 + (T(d) - t0) / (t1 - t0) * (W - 8), Y = v => H - 4 - v / 100 * (H - 10);
  const pts = []; for (let t = t0; t <= t1; t += 4 * DIA) pts.push(iso(t));
  const p = pts.map((d, i) => (i ? 'L' : 'M') + X(d).toFixed(1) + ' ' + Y(A.pv(d)).toFixed(1)).join('');
  const r = pts.filter(d => d <= A.h).concat([A.h]).map((d, i) => (i ? 'L' : 'M') + X(d).toFixed(1) + ' ' + Y(A.ev(d)).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${p}" stroke="var(--plan)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/><path d="${r}" stroke="var(--real)" stroke-width="2.6" fill="none" vector-effect="non-scaling-stroke"/></svg>`;
}
function ligarGrafico(){
  const el = $('#ch'); if (!el || !CH) return;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), gd = el.querySelector('#gd'), hv = el.querySelector('#hv');
  const mover = e => {
    const r = svg.getBoundingClientRect(), sc = r.width / CH.W, cx = (e.touches ? e.touches[0].clientX : e.clientX), x = (cx - r.left) / sc;
    const t = clamp(CH.t0 + (x - CH.L) / CH.pw * (CH.t1 - CH.t0), CH.t0, CH.t1), d = iso(Math.round(t / DIA) * DIA), A = CH.A;
    gd.setAttribute('x1', CH.X(d)); gd.setAttribute('x2', CH.X(d)); gd.setAttribute('opacity', '.4');
    tip.hidden = false; tip.innerHTML = `<b>${brc(d)}</b><br>Planejado ${pct(A.pv(d))}` + (d <= A.h ? `<br>Realizado ${pct(A.ev(d))}` : '');
    tip.style.left = clamp(CH.X(d) * sc, tip.offsetWidth / 2, r.width - tip.offsetWidth / 2) + 'px'; tip.style.top = (CH.Y(100) * sc + 6) + 'px';
  };
  hv.addEventListener('mousemove', mover); hv.addEventListener('touchmove', mover, {passive:true});
  const sai = () => { tip.hidden = true; gd.setAttribute('opacity', '0'); };
  hv.addEventListener('mouseleave', sai); hv.addEventListener('touchend', sai);
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'SELECT') return;
  try {
    switch (a){
      case 'entrar': { const b = $('#gbtn'); b.disabled = true; $('#gi').innerHTML = '<span class="spin"></span>'; $('#gtx').textContent = 'Redirecionando para o Google…';
        try { await API.entrar(); } catch (err){ b.disabled = false; $('#gtx').textContent = 'Continuar com Google'; $('#gi').innerHTML = iconeG(); throw err; } break; }

      case 'sb-fechar': document.body.classList.remove('sb-open'); break;

      case 'tarefa-excluir': if (el.dataset.ok){ await API.delTarefa(id); fechar(); toast('Entrega excluída.'); await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Confirmar exclusão'; } break;
      case 'projeto-novo': modalProjeto(); break;

      case 'projeto-excluir': if (el.dataset.ok){ await API.delProjeto(id); fechar(); toast('Projeto excluído.'); ir('projetos'); await recarregar(); } else { el.dataset.ok = '1'; el.textContent = 'Excluir projeto e entregas?'; } break;
      case 'com-excluir': await API.delComentario(id); await recarregar(true); gavetaTarefa(el.dataset.t); break;
      case 'pref': { const on = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', String(on));
        const c = id === 'c' ? on : !!ME.receber_conclusoes, r = id === 'r' ? on : !!ME.receber_resumo;
        try { await API.preferencias(c, r); toast('Preferência salva.'); } catch (err){ el.setAttribute('aria-checked', String(!on)); throw err; } break; }
      case 'u-tab': UI.utab = id; render(); break;
      case 'u-aprovar': { const s = document.getElementById('papel-' + id), papel = s ? s.value : null;
        await API.setMembro(id, {status:'aprovado', aprovado_em:new Date().toISOString(), aprovado_por:USER.email, ...(papel ? {papel} : {})}); await recarregar(true); render(); toast('Acesso aprovado.'); break; }
      case 'u-bloquear': await API.setMembro(id, {status:'bloqueado'}); await recarregar(true); render(); toast(UI.utab === 'pendente' ? 'Pedido recusado.' : 'Acesso bloqueado.'); break;
      case 'instalar': e.preventDefault(); await instalar(); break;
    }
  } catch (err){ toast('Não foi possível concluir: ' + err.message, true); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.f && el.dataset.f !== 'q' && el.dataset.f !== 'uq'){ UI[el.dataset.f] = el.value; render(); }
  if (el.dataset.a === 'u-papel'){ try { await API.setMembro(el.dataset.id, {papel:el.value}); toast('Papel atualizado.'); await recarregar(true); } catch (err){ toast(err.message, true); } }
});
document.addEventListener('input', e => { const el = e.target, f = el.dataset.f; if (f === 'q' || f === 'uq'){ UI[f] = el.value; const p = el.selectionStart; render(); const n = document.querySelector(`[data-f="${f}"]`); if (n){ n.focus(); n.setSelectionRange(p, p); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ fechar(); document.body.classList.remove('sb-open'); } });
if ('serviceWorker' in navigator && !DEMO && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});

if (!DEMO){
  if (!window.supabase){ document.getElementById('root').innerHTML = '<div class="auth"><section class="a-r" style="grid-column:1/-1"><div class="a-box"><h2>Não foi possível carregar</h2><p class="s">Verifique a conexão com a internet e atualize a página.</p></div></section></div>'; }
  else { sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {auth:{flowType:'pkce', detectSessionInUrl:true, persistSession:true}});
    sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' && !ME) iniciar(); if (ev === 'SIGNED_OUT'){ USER = null; ME = null; render(); } });
    iniciar(); }
} else { render(); }
</script>
</body>
